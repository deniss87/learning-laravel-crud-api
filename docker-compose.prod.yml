services:
  app:
    image: ghcr.io/deniss87/learning-laravel-crud-api:latest
    container_name: crm_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.prod
    volumes:
      - assets_data:/var/www/public_shared
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm_network
  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - assets_data:/var/www/public:ro
    depends_on:
      - app
    networks:
      - crm_network
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel_crm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  assets_data:
